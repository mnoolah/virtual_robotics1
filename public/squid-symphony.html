<title>سمفونية الحبّار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
  :root {
    --abyss: #041722;
    --glass: rgba(6, 30, 43, 0.78);
    --glass-2: rgba(16, 52, 68, 0.6);
    --line: rgba(160, 208, 218, 0.2);
    --ink: #eef5f2;
    --muted: #9dbcc2;
    --coral: #f08a68;
    --coral-deep: #2d1007;
    --shell: #ffd9c8;
    --gold: #eccb7a;
    --display: "Amiri", "Noto Naskh Arabic", "Times New Roman", serif;
    --body: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--abyss); color: var(--ink); font-family: var(--body); font-size: 15px; overflow: hidden; }
  #app { position: fixed; inset: 0; overflow: hidden; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene.hovering { cursor: pointer; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .top {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 18px);
    inset-inline: 18px;
    display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap;
    gap: 10px 20px;
    pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .brand h1 {
    margin: 0;
    font-family: var(--display); font-weight: 700;
    font-size: clamp(30px, 3.8vw, 44px); line-height: 1.05;
    text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
  }
  .brand h1 span { color: var(--coral); }
  .brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: flex; padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(10px); }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 15px; border-radius: 999px; cursor: pointer; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--abyss); font-weight: 600; }
  .btn { border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(10px); border-radius: 999px; padding: 8px 15px; cursor: pointer; font-size: 14px; white-space: nowrap; }
  .btn:hover { border-color: rgba(238, 245, 242, 0.45); }
  .btn[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .btn.primary { background: var(--coral); color: var(--coral-deep); border-color: transparent; font-weight: 600; }

  .card {
    position: absolute;
    top: 118px;
    inset-inline-start: 18px;
    width: min(340px, calc(100% - 36px));
    max-height: calc(100% - 118px - 96px);
    overflow-y: auto;
    display: grid; gap: 12px;
    padding: 18px 18px 16px;
    border-radius: 18px;
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: blur(16px);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .kind { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: rgba(238, 245, 242, 0.1); }
  .kind.int { background: rgba(240, 138, 104, 0.2); color: var(--shell); }
  .close { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 22px; line-height: 1; padding: 2px 6px; border-radius: 8px; }
  .close:hover { color: var(--ink); }
  .card h2 { margin: 0; font-family: var(--display); font-size: 32px; line-height: 1.15; text-wrap: balance; }
  .latin { margin-top: -8px; font-family: var(--mono); font-size: 12.5px; color: var(--muted); direction: ltr; text-align: end; }
  .card p { margin: 0; line-height: 1.85; }
  .fact { padding: 12px 14px; border-radius: 12px; background: var(--glass-2); }
  .fact b { display: block; font-size: 13px; font-weight: 600; color: var(--gold); margin-bottom: 2px; }
  .fact p { font-size: 14px; line-height: 1.8; }

  .hint {
    position: absolute;
    left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 78px);
    padding: 7px 16px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px);
    color: var(--muted); font-size: 13.5px; white-space: nowrap;
    pointer-events: none;
  }
  .parts {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    inset-inline: 18px;
    display: flex; gap: 6px; align-items: center;
    overflow-x: auto; scrollbar-width: none;
    padding: 6px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: blur(12px);
  }
  .parts::-webkit-scrollbar { display: none; }
  .parts .grp { flex: none; font-size: 12px; color: var(--muted); padding-inline: 8px 2px; }
  .parts .sep { flex: none; width: 1px; height: 20px; background: var(--line); margin-inline: 4px; }
  .chip { flex: none; border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13.5px; color: var(--ink); white-space: nowrap; }
  .chip:hover { background: rgba(238, 245, 242, 0.08); }
  .chip[aria-pressed="true"] { background: var(--coral); color: var(--coral-deep); font-weight: 600; }

  .pin { position: absolute; left: 0; top: 0; pointer-events: none; }
  .pin-dot { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--shell); box-shadow: 0 0 0 3px rgba(4, 23, 34, 0.5), 0 0 16px 3px rgba(240, 138, 104, 0.8); }
  .pin-line { position: absolute; left: 0; bottom: 6px; width: 1px; height: 52px; background: linear-gradient(to top, var(--shell), rgba(255, 217, 200, 0)); }
  .pin-label { position: absolute; left: 0; bottom: 58px; transform: translateX(-50%); padding: 3px 12px 5px; border-radius: 8px; background: rgba(4, 23, 34, 0.85); font-family: var(--display); font-size: 19px; white-space: nowrap; direction: rtl; }
  .tip { position: absolute; left: 0; top: 0; padding: 4px 10px; border-radius: 8px; background: rgba(238, 245, 242, 0.95); color: var(--abyss); font-size: 13px; font-weight: 600; pointer-events: none; white-space: nowrap; direction: rtl; }

  /* video of the swimming squid */
  .film { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 20%, #1d6580, #062331 60%, #03141e); cursor: pointer; }
  .film.exploring { cursor: default; }
  .film-inner { position: absolute; transform-origin: 0 0; transition: transform 1s cubic-bezier(.65,0,.35,1); will-change: transform; }
  .film video { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .spots { position: absolute; inset: 0; transition: opacity 0.4s; }
  .film:not(.exploring) .spots { opacity: 0; pointer-events: none; }
  .hs { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; transform: scale(calc(1 / var(--z, 1))); transition: transform 1s cubic-bezier(.65,0,.35,1); }
  .hs::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: rgba(238, 245, 242, 0.95); box-shadow: 0 0 0 3px rgba(3, 18, 28, 0.35); animation: breathe 2.8s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .hs.int::before { background: var(--shell); }
  .hs-lbl { position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%); padding: 3px 10px 4px; border-radius: 8px; background: rgba(3, 18, 28, 0.86); font-family: var(--display); font-size: 17px; white-space: nowrap; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .hs:hover .hs-lbl, .hs:focus-visible .hs-lbl, .hs[aria-pressed="true"] .hs-lbl { opacity: 1; }
  .hs[aria-pressed="true"]::before { inset: 7px; background: var(--coral); box-shadow: 0 0 0 3px rgba(3, 18, 28, 0.4), 0 0 18px 5px rgba(240, 138, 104, 0.75); }
  @keyframes breathe { 0%, 100% { box-shadow: 0 0 0 3px rgba(3, 18, 28, 0.35), 0 0 0 0 rgba(238, 245, 242, 0.5); } 50% { box-shadow: 0 0 0 3px rgba(3, 18, 28, 0.35), 0 0 0 9px rgba(238, 245, 242, 0); } }
  .resume { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 76px); }
  @media (prefers-reduced-motion: reduce) { .film-inner, .hs { transition: none; } .hs::before { animation: none; } }
  .ref { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(2, 12, 18, 0.82); backdrop-filter: blur(6px); padding: 24px 16px; }
  .ref figure { margin: 0; display: grid; gap: 10px; max-width: min(760px, 100%); }
  .ref img { width: 100%; max-height: calc(100vh - 140px); object-fit: contain; border-radius: 14px; }
  .ref figcaption { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }

  .loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--abyss); color: var(--muted); padding-inline: 16px; text-align: center; }

  @media (max-width: 760px) {
    .brand p { display: none; }
    .brand h1 { font-size: 28px; }
    .seg button { padding: 6px 11px; font-size: 13px; }
    .btn { padding: 7px 12px; font-size: 13px; }
    .card { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); inset-inline: 12px; width: auto; max-height: 42%; padding: 14px; gap: 8px; }
    .card h2 { font-size: 26px; }
    .parts { inset-inline: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
    .hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); font-size: 12.5px; }
    .resume { bottom: calc(env(safe-area-inset-bottom, 0px) + 68px); }
    .film video { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent); }
    .hs-lbl { font-size: 15px; }
  }
</style>

<div id="app" dir="rtl" lang="ar">
  <canvas id="scene" aria-label="مجسم ثلاثي الأبعاد لحبّار مشرّح يمكن تدويره والضغط على أجزائه"></canvas>
  <div class="film" id="film">
    <div class="film-inner" id="film-inner">
      <video id="vid" muted playsinline loop autoplay preload="auto" poster="squid-frame.webp" aria-label="فيديو لحبّار مشرّح يسبح فوق الشعاب"><source src="squid-swim.mp4" type="video/mp4"></video>
      <div class="spots" id="spots"></div>
    </div>
  </div>
  <div class="pin" id="pin" hidden><span class="pin-line"></span><span class="pin-dot"></span><span class="pin-label" id="pin-label"></span></div>
  <div class="tip" id="tip" hidden></div>

  <header class="top">
    <div class="brand">
      <h1>سمفونية <span>الحبّار</span></h1>
      <p>تسعة عشر جزءًا تعمل معًا بانسجام، اكتشفها من الخارج والداخل.</p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="طريقة العرض">
        <button type="button" data-view="film" aria-pressed="true">الفيديو</button>
        <button type="button" data-view="dissect" aria-pressed="false">تشريح</button>
        <button type="button" data-view="external" aria-pressed="false">خارجي</button>
        <button type="button" data-view="glass" aria-pressed="false">شفاف</button>
      </div>
      <button type="button" class="btn primary" id="tour">جولة هادئة</button>
      <button type="button" class="btn" id="sound" aria-pressed="false">صوت البحر</button>
    </div>
  </header>

  <aside class="card" id="card" hidden aria-live="polite">
    <div class="card-head"><span class="kind" id="c-kind"></span><button type="button" class="close" id="c-close" aria-label="إغلاق">×</button></div>
    <h2 id="c-name"></h2>
    <div class="latin" id="c-latin"></div>
    <p id="c-desc"></p>
    <div class="fact"><b>هل تعلم؟</b><p id="c-fact"></p></div>
  </aside>

  <div class="hint" id="hint">اضغط على الحبّار لإيقافه واستكشاف أجزائه</div>
  <button type="button" class="btn primary resume" id="resume" hidden>▶ تابع السباحة</button>
  <nav class="parts" id="parts" aria-label="أجزاء الحبّار"></nav>

  <div class="loading" id="loading">جارٍ تجهيز الحبّار…</div>
</div>

<script>
  setTimeout(function () {
    var l = document.getElementById('loading');
    if (l && !l.hidden) l.textContent = 'تعذّر تحميل مكتبة الرسم ثلاثي الأبعاد. تحقق من الاتصال ثم أعد تحميل الصفحة.';
  }, 15000);
</script>

      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (s) => document.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ------------------------------------------------------------------ */
/* Content                                                             */
/* ------------------------------------------------------------------ */
// view: which view shows the part best. deg: its note in the soft pentatonic chime.
const PARTS = [
  { id: 'mantle', kind: 'ext', name: 'الرداء العضلي', latin: 'Mantle', deg: 2, view: 'external',
    desc: 'الجدار العضلي الذي يغلّف الجسم ويحمي الأعضاء. حين ينقبض يدفع الماء بقوة عبر القمع، فيندفع الحبّار بالدفع النفّاث.',
    fact: 'تندفع بعض أنواع الحبّار من الماء بقوة الرداء وتنزلق في الهواء عدة أمتار هربًا من مفترسيها.',
    anchor: [0.55, 0.82, 0.35], cam: { dir: [0.1, 0.4, 1], dist: 7 } },
  { id: 'fins', kind: 'ext', name: 'الزعنفتان', latin: 'Fins', deg: 7, view: 'external',
    desc: 'زعنفتان عريضتان في مؤخرة الرداء، تتموّجان للسباحة الهادئة والتوازن وتغيير الاتجاه.',
    fact: 'في السباحة البطيئة تعمل الزعنفتان وحدهما تقريبًا، فيوفّر الحبّار الطاقة التي يستهلكها الدفع النفّاث.',
    anchor: null, cam: { dir: [0.35, 0.5, 1], dist: 4.8 } },
  { id: 'siphon', kind: 'ext', name: 'القمع', latin: 'Funnel (siphon)', deg: 4, view: 'external',
    desc: 'أنبوب عضلي أسفل الرأس يخرج منه الماء المندفع من الرداء. يوجّهه الحبّار كفوهة ليغيّر اتجاهه، ومنه يخرج الحبر.',
    fact: 'يستطيع الحبّار أن يلوي قمعه للأمام أو للخلف، فيسبح في الاتجاهين دون أن يستدير.',
    anchor: [-0.55, -0.6, 0.2], cam: { dir: [-0.3, -0.5, 1], dist: 3.0 } },
  { id: 'skin', kind: 'ext', name: 'الجلد والحاملات اللونية', latin: 'Chromatophores', deg: 9, view: 'external',
    desc: 'بقع صغيرة من الصبغة في الجلد، تحيط بكل منها عضلات يحرّكها الدماغ مباشرة. تتمدد وتنكمش فيتغيّر لون الحبّار ونقشه.',
    fact: 'لأن الأعصاب تحرّك الحاملات اللونية مباشرة، يغيّر الحبّار لونه في أقل من ثانية.',
    anchor: [-0.4, 0.56, 0.3], cam: { dir: [0.1, 0.5, 1], dist: 3.6 } },
  { id: 'eyes', kind: 'ext', name: 'العينان', latin: 'Camera-type eyes', deg: 8, view: 'external',
    desc: 'عينان كبيرتان تشبهان الكاميرا، لكل منهما عدسة وشبكية، تمنحان الحبّار رؤية حادة في الأعماق المعتمة.',
    fact: 'أعصاب شبكية الحبّار تقع خلف الخلايا الضوئية، لذلك لا توجد في عينه بقعة عمياء كالتي في عين الإنسان.',
    anchor: [-0.55, 0.12, 0.9], cam: { dir: [0.05, 0.15, 1], dist: 2.4 } },
  { id: 'arms', kind: 'ext', name: 'الأذرع الثمانية', latin: 'Arms (8)', deg: 5, view: 'external',
    desc: 'ثماني أذرع قوية تصطف على باطنها الممصات. تمسك الفريسة بعد التقاطها وتقرّبها من المنقار.',
    fact: 'في كثير من أنواع الحبّار تحيط بكل ممص حلقة صلبة مسنّنة تمنع الفريسة الزلقة من الإفلات.',
    anchor: [-2.3, -0.45, 0.5], cam: { dir: [-0.1, 0.1, 1], dist: 4.8 } },
  { id: 'tentacles', kind: 'ext', name: 'اللامستان', latin: 'Tentacles & club', deg: 3, view: 'external',
    desc: 'ذراعان أطول من البقية تنتهيان بـ«هراوة» مليئة بالممصات، تنطلقان فجأة لاقتناص الفريسة.',
    fact: 'تنطلق اللامستان نحو الفريسة في أجزاء من الثانية، وهي من أسرع حركات الصيد في البحر.',
    anchor: null, cam: { dir: [-0.1, 0.1, 1], dist: 5.6 } },
  { id: 'beak', kind: 'ext', name: 'المنقار', latin: 'Beak', deg: 6, view: 'glass',
    desc: 'منقار صلب من الكيتين يشبه منقار الببغاء، في منتصف قاعدة الأذرع. يقطّع الفريسة إلى قطع صغيرة.',
    fact: 'المنقار من أصلب أجزاء الحبّار، ويبقى في معدة الحيتان بعد هضم باقي الجسم، ومنه عرف العلماء الكثير عن الحبّار العملاق.',
    anchor: [-1.62, 0, 0], cam: { dir: [-1, 0.2, 0.6], dist: 2.4 } },
  { id: 'digestive', kind: 'int', name: 'الغدة الهضمية', latin: 'Digestive gland', deg: 2, view: 'dissect',

    anchor: [1.75, 0.06, 0.34], cam: { dir: [0.05, 0.3, 1], dist: 3.2 } },
  { id: 'ink', kind: 'int', name: 'كيس الحبر', latin: 'Ink sac', deg: 0, view: 'dissect',

    fact: 'قد يطلق الحبّار كتلة حبر مخاطية بحجم جسمه تقريبًا، فينشغل بها المفترس بينما يهرب الحبّار.',
    anchor: [1.45, -0.34, 0.3], cam: { dir: [0.05, 0.1, 1], dist: 2.8 } },
  { id: 'stomach', kind: 'int', name: 'المعدة', latin: 'Stomach', deg: 4, view: 'dissect',
    desc: 'كيس عضلي يستقبل الطعام من المريء، فيخلطه بالإنزيمات ويطحنه.',
    fact: 'يمر الطعام من المنقار عبر مريء رفيع يخترق الدماغ، ثم يقطع الرداء حتى يصل إلى المعدة.',
    anchor: [2.65, -0.02, 0.32], cam: { dir: [0.05, 0.3, 1], dist: 2.8 } },
  { id: 'caecum', kind: 'int', name: 'الأعور والأمعاء', latin: 'Caecum & intestine', deg: 7, view: 'dissect',
    desc: 'الأعور كيس يمتص الغذاء المهضوم، ثم تلتف الأمعاء وتحمل البقايا نحو فتحة الإخراج قرب القمع.',
    fact: 'تحمل جدران الأعور ثنيات رقيقة تزيد مساحة الامتصاص كثيرًا.',
    anchor: [3.3, 0.06, 0.3], cam: { dir: [0.05, 0.3, 1], dist: 3.0 } },
  { id: 'gonad', kind: 'int', name: 'الغدة التناسلية', latin: 'Gonad', deg: 5, view: 'dissect',
    desc: 'عضو طويل فاتح اللون. ينتج البيوض عند الأنثى والحيوانات المنوية عند الذكر.',
    fact: 'تعيش معظم أنواع الحبّار نحو سنة أو سنتين، وتتكاثر مرة واحدة في آخر حياتها.',

/* Sound: a calm sea and very soft chimes                              */
/* ------------------------------------------------------------------ */
const Sound = {
  ctx: null, on: false,
  init() {
    if (this.ctx) { this.ctx.resume(); return true; }
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return false;
    const ctx = (this.ctx = new C());
    this.master = ctx.createGain(); this.master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor();
    this.master.connect(comp); comp.connect(ctx.destination);

    // chimes: soft, rounded, with a long hall
    this.music = ctx.createGain(); this.music.gain.value = 0.5;
    const soft = ctx.createBiquadFilter(); soft.type = 'lowpass'; soft.frequency.value = 2600;
    this.music.connect(soft); soft.connect(this.master);
    const rev = ctx.createConvolver(); rev.buffer = this.impulse(5, 2.4);
    const wet = ctx.createGain(); wet.gain.value = 0.7;
    soft.connect(rev); rev.connect(wet); wet.connect(this.master);

    // sea: brown noise swells, left and right drifting out of step
    const sr = ctx.sampleRate, len = sr * 8;
    const brown = ctx.createBuffer(2, len, sr);
    for (let c = 0; c < 2; c++) {
      const d = brown.getChannelData(c); let last = 0;
      for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.2; }
    }
    this.sea = ctx.createGain(); this.sea.gain.value = 1; this.sea.connect(this.master);
    const wave = (pan, rate, phase) => {
      const src = ctx.createBufferSource(); src.buffer = brown; src.loop = true;
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 520; f.Q.value = 0.2;
      const g = ctx.createGain(); g.gain.value = 0.34;
      const lfo = ctx.createOscillator(); lfo.frequency.value = rate;
      const lg = ctx.createGain(); lg.gain.value = 0.26; lfo.connect(lg); lg.connect(g.gain);
      const lf = ctx.createGain(); lf.gain.value = 300; lfo.connect(lf); lf.connect(f.frequency);
      const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      src.connect(f); f.connect(g);
      if (p) { p.pan.value = pan; g.connect(p); p.connect(this.sea); } else g.connect(this.sea);
      src.start(0, phase); lfo.start(ctx.currentTime + phase);
    };
    fetch('squid-sea.mp3').then((r) => { if (!r.ok) throw 0; return r.arrayBuffer(); })
      .then((b) => ctx.decodeAudioData(b))
      .then((buf) => { const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true; const g = ctx.createGain(); g.gain.value = 1.1; src.connect(g); g.connect(this.sea); src.start(); })
      .catch(() => { wave(-0.55, 0.075, 0); wave(0.55, 0.061, 3.3); wave(0, 0.043, 5.1); });
    this.loops();
    return true;
  },
  impulse(sec, decay) {
    const ctx = this.ctx, len = Math.floor(ctx.sampleRate * sec);
    const b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return b;
  },
  freq(deg, oct = 1) { const st = [0, 2, 4, 7, 9]; return 146.83 * Math.pow(2, (st[((deg % 5) + 5) % 5] + 12 * Math.floor(deg / 5) + 12 * oct) / 12); },
  chime(f, t, vol) {
    const ctx = this.ctx;
    [[1, 1], [2, 0.18], [3.01, 0.05]].forEach(([m, a]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol * a, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2 / m + 0.4);
      o.connect(g); g.connect(this.music); o.start(t); o.stop(t + 4);
    });
  },
  play(id) {
    if (!this.on) return;
    const d = PART[id].deg, t = this.ctx.currentTime + 0.03;
    this.chime(this.freq(d), t, 0.07);
    this.chime(this.freq(d + 2), t + 0.28, 0.04);
  },
  bubble() {
    const ctx = this.ctx, t = ctx.currentTime + 0.02, f0 = 450 + Math.random() * 450;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 2, t + 0.06);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.008, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    o.connect(g); g.connect(this.sea); o.start(t); o.stop(t + 0.1);
  },
  loops() {
    const notes = () => {
      if (this.on) this.chime(this.freq([0, 2, 4, 5, 7, 9][(Math.random() * 6) | 0]), this.ctx.currentTime + 0.05, 0.018 + Math.random() * 0.014);
      setTimeout(notes, 3000 + Math.random() * 4500);
    };
    const bubbles = () => { if (this.on && Math.random() < 0.6) this.bubble(); setTimeout(bubbles, 900 + Math.random() * 3500); };
    setTimeout(notes, 2500); setTimeout(bubbles, 1500);
  },
  fade(on) {
    if (!this.ctx) return;
    const g = this.master.gain, t = this.ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(on ? 0.9 : 0, t + (on ? 3 : 0.8));
  },
};

    if (it.life <= 0 && sys.acc >= 1) { sys.acc -= 1; it.life = 1; it.q.copy(mouth); it.v.set(-speed * (0.7 + Math.random() * 0.6), (Math.random() - 0.3) * spread, (Math.random() - 0.5) * spread); }
    if (it.life > 0) {
      it.life -= dt * 0.5; it.q.addScaledVector(it.v, dt); it.v.multiplyScalar(1 - dt * 1.2); it.v.y += dt * 0.15;
      sys.pos[i * 3] = it.q.x; sys.pos[i * 3 + 1] = it.q.y; sys.pos[i * 3 + 2] = it.q.z;
    } else sys.pos[i * 3] = 999;
  });

}

/* ------------------------------------------------------------------ */
/* View, camera, selection                                             */
/* ------------------------------------------------------------------ */
const state = { view: 'film', exploring: false, selected: null, hovered: null, tour: null };
let skinOpacity = 1, skinTarget = 1;
const HOME = { target: new THREE.Vector3(0.4, 0.5, 0), dir: new THREE.Vector3(0.05, 0.12, 1).normalize() };
let fly = null;
function fitDistance() {
  const a = canvas.clientWidth / Math.max(1, canvas.clientHeight);

}
function flyTo(target, pos, dur = 1.4) {
  if (reduceMotion) { controls.target.copy(target); camera.position.copy(pos); controls.update(); return; }

}
function goHome(instant = false) {
  HOME.target.x = canvas.clientWidth / Math.max(1, canvas.clientHeight) < 1.2 ? 1.1 : 0.4;
  const pos = HOME.target.clone().addScaledVector(HOME.dir, fitDistance());
  if (instant) { controls.target.copy(HOME.target); camera.position.copy(pos); controls.update(); } else flyTo(HOME.target, pos, 1.6);
}
controls.addEventListener('start', () => { fly = null; });

function anchorWorld(id, out = new THREE.Vector3()) {
  if (id === 'tentacles') return squid.localToWorld(out.copy(limbs.find((l) => l.type === 'tentacles').pts[Math.round(ARM_N * 0.86)]));
  if (id === 'fins') return fins[0].localToWorld(out.set(5.4, 1.2, 0));
  return squid.localToWorld(out.set(...PART[id].anchor));
}
const film = $('#film'), filmInner = $('#film-inner'), vid = $('#vid'), resumeBtn = $('#resume');
function setView(v) {
  const wasFilm = state.view === 'film';
  state.view = v;
  const isFilm = v === 'film';
  film.hidden = !isFilm;
  canvas.style.visibility = isFilm ? 'hidden' : '';
  if (isFilm) { ui.pin.hidden = true; ui.tip.hidden = true; if (!state.exploring) vid.play().catch(() => {}); }
  else { vid.pause(); if (wasFilm && state.selected) { ui.pin.hidden = false; const id = state.selected; state.selected = null; select(id); } }
  updateHintUI();
  document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  skinTarget = v === 'glass' ? 0.2 : 1;
  cutTarget = v === 'dissect' ? 0.06 : 1.2;
}

const ui = { card: $('#card'), kind: $('#c-kind'), name: $('#c-name'), latin: $('#c-latin'), desc: $('#c-desc'), fact: $('#c-fact'), pin: $('#pin'), pinLabel: $('#pin-label'), tip: $('#tip'), hint: $('#hint') };
const chipEls = {};
{
  const bar = $('#parts');
  const group = (label, kind) => {
    const g = document.createElement('span'); g.className = 'grp'; g.textContent = label; bar.appendChild(g);
    PARTS.filter((p) => p.kind === kind).forEach((p) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = p.name; b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => userSelect(p.id));
      bar.appendChild(b); chipEls[p.id] = b;
    });
  };
  group('الداخل', 'int');
  const sep = document.createElement('span'); sep.className = 'sep'; bar.appendChild(sep);
  group('الخارج', 'ext');
}

function select(id, { doFly = true } = {}) {
  state.selected = id;
  for (const [pid, el] of Object.entries(chipEls)) el.setAttribute('aria-pressed', String(pid === id));
  for (const [pid, el] of Object.entries(spotEls)) el.setAttribute('aria-pressed', String(pid === id));
  ui.card.hidden = !id; ui.pin.hidden = !id || state.view === 'film';
  if (id && state.view === 'film' && !state.exploring) explore(true);
  updateHintUI();
  resize();
  if (!id) return;
  const p = PART[id];
  ui.kind.textContent = p.kind === 'int' ? 'جزء داخلي' : 'جزء خارجي';
  ui.kind.className = 'kind' + (p.kind === 'int' ? ' int' : '');
  ui.name.textContent = p.name; ui.latin.textContent = p.latin; ui.desc.textContent = p.desc; ui.fact.textContent = p.fact;
  ui.pinLabel.textContent = p.name;
  const film3d = state.view !== 'film';
  if (film3d && p.view === 'glass' && state.view !== 'glass') setView('glass');
  else if (film3d && p.view === 'dissect' && state.view === 'external') setView('dissect');
  if (id === 'tentacles') strike = 0.001;
  Sound.play(id);
  if (doFly && state.view !== 'film') {
    const tgt = anchorWorld(id);
    flyTo(tgt, tgt.clone().addScaledVector(new THREE.Vector3(...p.cam.dir).normalize(), p.cam.dist * 1.35 * (fitDistance() / 15.5)), 1.4);
  }
  chipEls[id].scrollIntoView({ block: 'nearest', inline: 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
}
function userSelect(id) { stopTour(); select(id); }
$('#c-close').addEventListener('click', () => { stopTour(); select(null); if (state.view !== 'film') goHome(); });
document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));

const soundBtn = $('#sound');
function setSound(on) {
  if (on && !Sound.init()) { soundBtn.textContent = 'الصوت غير مدعوم'; return; }
  Sound.on = on; Sound.fade(on);
  soundBtn.setAttribute('aria-pressed', String(on));
  soundBtn.textContent = on ? 'إيقاف الصوت' : 'صوت البحر';
}
soundBtn.addEventListener('click', () => setSound(!Sound.on));

const tourBtn = $('#tour');
const TOUR = ['mantle', 'fins', 'skin', 'eyes', 'arms', 'tentacles', 'siphon', 'digestive', 'ink', 'stomach', 'caecum', 'gonad', 'gills', 'branchial', 'heart', 'axon', 'brain', 'beak', 'gladius'];
function stopTour() {
  if (!state.tour) return;
  state.tour.forEach(clearTimeout); state.tour = null; tourBtn.textContent = 'جولة هادئة';
}
function startTour() {
  if (!Sound.on) setSound(true);
  const timers = (state.tour = []);
  tourBtn.textContent = 'إيقاف الجولة';
  if (state.view !== 'film') setView('external');
  TOUR.forEach((id, i) => timers.push(setTimeout(() => state.tour === timers && select(id), 500 + i * 5200)));
  timers.push(setTimeout(() => { if (state.tour !== timers) return; select(null); if (state.view !== 'film') { setView('dissect'); goHome(); } else explore(false); stopTour(); }, 500 + TOUR.length * 5200));
}
tourBtn.addEventListener('click', () => (state.tour ? stopTour() : startTour()));

// ---- video mode: swim, pause to explore, zoom to a part
const spotEls = {};
PARTS.forEach((p, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'hs' + (p.kind === 'int' ? ' int' : '');
  b.style.left = `${(FILM[p.id][0] / VW) * 100}%`; b.style.top = `${(FILM[p.id][1] / VH) * 100}%`;
  b.style.setProperty('--d', `${(i * 0.37) % 2.8}s`);
  b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', p.name);
  const l = document.createElement('span'); l.className = 'hs-lbl'; l.textContent = p.name; b.appendChild(l);
  b.addEventListener('click', (e) => { e.stopPropagation(); userSelect(p.id); });
  $('#spots').appendChild(b); spotEls[p.id] = b;
});
function updateHintUI() {
  const f = state.view === 'film';
  resumeBtn.hidden = !(f && state.exploring);
  ui.hint.hidden = !!state.selected || (f && state.exploring);
  ui.hint.textContent = f ? 'اضغط على الحبّار لإيقافه واستكشاف أجزائه' : 'اسحب للتدوير · اضغط على أي جزء لتتعرّف عليه';
}
function explore(on) {
  state.exploring = on;
  film.classList.toggle('exploring', on);
  if (on) { vid.pause(); try { vid.currentTime = FREEZE; } catch (e) {} }
  else { if (state.selected) select(null); vid.play().catch(() => {}); }
  updateHintUI();
}
film.addEventListener('click', () => { if (!state.exploring) { stopTour(); explore(true); } });
resumeBtn.addEventListener('click', () => { stopTour(); explore(false); });
function layoutFilm() {
  const W = innerWidth, H = innerHeight;
  const topB = document.querySelector('.top').getBoundingClientRect().bottom;
  const partsT = $('#parts').getBoundingClientRect().top;
  let s, x0, y0;
  if (W / H > 1.1) { s = Math.max(W / VW, H / VH); x0 = (W - VW * s) / 2; y0 = (H - VH * s) / 2; }
  else { s = (W * 1.12) / VW; x0 = (W - VW * s) / 2; y0 = topB + (partsT - topB - VH * s) / 2; }
  Object.assign(filmInner.style, { left: `${x0}px`, top: `${y0}px`, width: `${VW * s}px`, height: `${VH * s}px` });
  let z = 1, tx = 0, ty = 0;
  if (state.selected) {
    z = W > 760 ? 1.9 : 1.7;
    let cx = W / 2, cy = (topB + partsT) / 2;
    if (!ui.card.hidden) {
      const c = ui.card.getBoundingClientRect();
      if (W > 760) cx = (18 + c.left - 18) / 2; else cy = (topB + c.top) / 2;
    }
    const [u, v] = FILM[state.selected];
    tx = cx - x0 - z * u * s; ty = cy - y0 - z * v * s;
  }
  filmInner.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
  filmInner.style.setProperty('--z', z);
}

// picking (ignores skin that the cutaway has removed)
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), _lp = new THREE.Vector3();
function inWindow(worldPt) {
  squid.worldToLocal(_lp.copy(worldPt));
  return _lp.z > cutVal && _lp.x > WX0 && _lp.x < WX1;
}
function pick(cx, cy) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, false).filter((h) => !(h.object.material.userData.cut && inWindow(h.point)));
  if (!hits.length) return null;
  if (state.view === 'glass') { const org = hits.find((h) => PART[h.object.userData.part].kind === 'int'); if (org) return org.object.userData.part; }
  return hits[0].object.userData.part;
}
let down = null, hoverQ = null;
canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', (e) => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 6) return;
  const id = pick(e.clientX, e.clientY);
  if (id) userSelect(id);
});
canvas.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') hoverQ = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerleave', () => { hoverQ = null; state.hovered = null; ui.tip.hidden = true; canvas.classList.remove('hovering'); });

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const top = document.querySelector('.top').getBoundingClientRect();
  const bottom = h - $('#parts').getBoundingClientRect().top;
  let sx = 0, sy = (bottom - top.bottom) / 2 * 0.5;
  if (w > 760) { if (!ui.card.hidden) sx = (ui.card.getBoundingClientRect().width + 18) / 2; }
  else if (!ui.card.hidden) sy = (h - ui.card.getBoundingClientRect().top - top.bottom) / 2;
  camera.setViewOffset(w, h, sx, sy, w, h);
  camera.updateProjectionMatrix();
  layoutFilm();
}
new ResizeObserver(resize).observe(canvas);
resize();
goHome(true);
setView('film');

/* ------------------------------------------------------------------ */
/* Loop                                                                */
/* ------------------------------------------------------------------ */
const clock = new THREE.Clock(), _v = new THREE.Vector3(), hl = new THREE.Color(0xff9a78);
let frame = 0;
const pulse = (x) => { const p = x - Math.floor(x); return Math.exp(-Math.pow((p - 0.08) / 0.05, 2)) + 0.55 * Math.exp(-Math.pow((p - 0.27) / 0.05, 2)); };
function setEmissive(id, on, k) {
  partMats[id]?.forEach((m) => {
    if (on) { m.emissive.copy(hl); m.emissiveIntensity = k; }
    else { m.emissive.copy(m.userData.base.e); m.emissiveIntensity = m.userData.base.i; }
  });
}
function tick() {
  if (state.view === 'film') { clock.getDelta(); requestAnimationFrame(tick); return; }
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, mo = reduceMotion ? 0.2 : 1;
  frame++;
  if (fly) {
    const k = Math.min(1, (performance.now() - fly.t0) / fly.dur);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    controls.target.lerpVectors(fly.ft, fly.tt, e); camera.position.lerpVectors(fly.fp, fly.tp, e);
    if (k >= 1) fly = null;
  }
  controls.update();

  if (hoverQ) {
    const id = pick(hoverQ.x, hoverQ.y);
    state.hovered = id; canvas.classList.toggle('hovering', !!id);
    ui.tip.hidden = !id;
    if (id) { const r = canvas.getBoundingClientRect(); ui.tip.textContent = PART[id].name; ui.tip.style.transform = `translate(${hoverQ.x - r.left + 14}px, ${hoverQ.y - r.top + 16}px)`; }
    hoverQ = null;
  }

  // gentle swimming
  squid.position.y = Math.sin(t * 0.5) * 0.12 * mo;
  squid.rotation.z = 0.46 + Math.sin(t * 0.37) * 0.025 * mo;
  const breath = Math.sin(t * 1.3);
  mantleGroup.scale.set(1, 1 + 0.02 * breath * mo, 1 + 0.02 * breath * mo);
  fins.forEach((f) => { f.rotation.x = f.userData.baseRot + f.userData.side * Math.sin(t * 1.8) * 0.14 * mo; });
  const hp = pulse(t * 1.05), bp = pulse(t * 1.05 - 0.18);
  hearts.systemic.scale.setScalar(1 + (state.selected === 'heart' ? 0.2 : 0.1) * hp * mo);
  const bs = 1 + (state.selected === 'branchial' ? 0.26 : 0.12) * bp * mo;
  hearts.b1.scale.setScalar(bs); hearts.b2.scale.setScalar(bs);

  if (strike > 0) { strike += dt * 1.2; if (strike > 2) strike = 0; }
  const sv = strike > 0 ? (strike < 0.25 ? strike / 0.25 : Math.max(0, 1 - (strike - 0.6) / 1.2)) : 0;
  updateLimbs(t, sv);

  const energy = state.selected === 'skin' ? 1 : 0;
  if (energy ? frame % 2 === 0 : frame % 8 === 0) drawSkin(t, energy);

  // view transitions
  skinOpacity += (skinTarget - skinOpacity) * Math.min(1, dt * 4);
  cutVal += (cutTarget - cutVal) * Math.min(1, dt * 3);
  syncPlanes();
  for (const m of skinMats) {
    const base = m.userData.finOpacity ?? 1;
    m.opacity = Math.min(base, skinOpacity);
    m.depthWrite = m.opacity > 0.95;
  }
  rimMat.opacity = THREE.MathUtils.clamp((0.5 - cutVal) / 0.4, 0, 1) * 0.9;
  cutRim.visible = rimMat.opacity > 0.01;
  squid.localToWorld(cavityLight.position.set(3, 0.3, 2.2));
  cavityLight.intensity = THREE.MathUtils.lerp(cavityLight.intensity, state.view === 'external' ? 0 : 5, Math.min(1, dt * 3));

  flow.items.forEach((it, i) => { it.u = (it.u + it.sp * dt * (1 + hp)) % 1; it.c.getPointAt(it.u, _v); flow.pos.set([_v.x, _v.y, _v.z], i * 3); });
  flow.p.geometry.attributes.position.needsUpdate = true;
  flow.p.material.opacity = state.view === 'external' ? 0 : 0.8;

  bubbles.rate = state.selected === 'siphon' || state.selected === 'mantle' ? 26 : 1.5;
  inkCloud.rate = state.selected === 'ink' ? 9 : 0;
  updateJet(bubbles, dt, 0.5, 2.2); updateJet(inkCloud, dt, 0.9, 1.3);

  for (const p of PARTS) {
    if (p.id === state.selected) setEmissive(p.id, true, 0.18 + 0.14 * (0.5 + 0.5 * Math.sin(t * 3.5)));
    else if (p.id === state.hovered) setEmissive(p.id, true, 0.16);
    else setEmissive(p.id, false);
  }

  const sp = snow.geometry.attributes.position;
  for (let i = 0; i < sp.count; i++) { let y = sp.getY(i) - dt * 0.1; if (y < -12) y = 12; sp.setY(i, y); }
  sp.needsUpdate = true;
  shafts.forEach((s) => { s.material.opacity = 0.07 + 0.06 * (0.5 + 0.5 * Math.sin(t * 0.45 + s.userData.ph)); });

  renderer.render(scene, camera);

  if (state.selected) {
    anchorWorld(state.selected, _v).project(camera);
    ui.pin.hidden = _v.z > 1;
    ui.pin.style.transform = `translate(${(_v.x * 0.5 + 0.5) * canvas.clientWidth}px, ${(-_v.y * 0.5 + 0.5) * canvas.clientHeight}px)`;
  }
  requestAnimationFrame(tick);
}
$('#loading').hidden = true;
requestAnimationFrame(tick);
</script>
